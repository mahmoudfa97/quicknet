name: Supabase Keepalive

on:
  schedule:
    # every day (UTC). Free tier pauses after ~1 week; daily is safe.
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Touch Supabase DB via RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          echo "Calling keepalive_touch()..."
          curl -sS -f \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive_touch" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            -D /tmp/headers.txt \
            -o /tmp/body.txt

          echo "✅ RPC success"
          echo "--- response headers ---"
          cat /tmp/headers.txt
